<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Mateus Fonseca Campos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script>
        if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body data-page="projects" class="bg-slate-900 text-slate-100 dark:bg-slate-50 dark:text-slate-900 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">
    
    <!-- Navbar gets injected here -->
    <div id="navbar-placeholder"></div>
    
    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto p-6 py-12 space-y-10 flex-grow">
        
        <!-- Page Title & Export Actions -->
        <section class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="space-y-2">
                <h1 class="text-4xl font-extrabold tracking-tight">Projects & Repositories</h1>
                <p class="text-slate-400 dark:text-slate-600 text-lg">
                    Use the controls below to filter and sort the project list.
                </p>
            </div>
        </section>

        <!-- Sophisticated Multi-Dropdown Check Filters -->
        <div id="filter-container" class="bg-slate-800/60 dark:bg-slate-100 p-6 rounded-2xl border border-slate-700/50 dark:border-slate-200 shadow-sm space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- 1. Context Dropdown -->
                <details data-category="context" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Context
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="context-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 2. Domain Dropdown -->
                <details data-category="domain" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Domain
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="domain-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 3. Programming Dropdown -->
                <details data-category="programming" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Programming
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="programming-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 4. Framework Dropdown -->
                <details data-category="framework" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Framework
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="framework-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 5. Database Dropdown -->
                <details data-category="database" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Database
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="database-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 6. Infrastructure Dropdown -->
                <details data-category="infrastructure" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Infrastructure
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="infrastructure-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 7. Data Science Dropdown -->
                <details data-category="data_science" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Data Science
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="datascience-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

                <!-- 8. Others Dropdown -->
                <details data-category="others" class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm transition">
                        <span class="flex items-center gap-2">
                            Others
                            <span class="filter-badge hidden text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div id="others-menu" class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 pr-4 space-y-2 text-sm max-h-60 overflow-y-auto overflow-x-hidden"></div>
                </details>

            </div>

            <!-- Lower Half: Sort Filter (Left) & Action Buttons (Right) -->
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 pt-6 border-t border-slate-700/50 dark:border-slate-200">
                
                <!-- 9. Sort Dropdown -->
                <div id="sort-container" class="filter-dropdown relative flex items-center w-full sm:w-fit bg-slate-900 dark:bg-white rounded-xl border border-blue-500 text-blue-400 dark:text-blue-600 font-semibold shadow-sm hover:border-blue-500 transition">
                    <div id="sort-summary-wrapper" class="flex-grow">
                        <div id="sort-trigger" class="flex justify-between items-center gap-3 px-4 py-2.5 cursor-pointer text-sm select-none whitespace-nowrap">
                            <span id="sort-summary-text">Sort by</span>
                            <svg id="sort-chevron" class="w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                    <button type="button" id="sort-order-btn" title="Toggle Sort Order" class="px-3 py-2.5 border-l border-slate-700 dark:border-slate-300 text-slate-400 hover:text-slate-200 dark:hover:text-slate-800 transition flex items-center justify-center shrink-0">
                        <svg id="sort-icon" class="w-4 h-4 transition-transform duration-200 scale-y-[-1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h8M3 12h6M3 18h4"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 18V6m0 0l-4 4m4-4l4 4"/>
                        </svg>
                    </button>
                    <div id="sort-dropdown-menu" class="dropdown-menu overflow-x-hidden pr-4 absolute top-full left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-2 space-y-1 text-sm font-normal hidden">
                        <label class="whitespace-nowrap sort-option flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-100 text-slate-200 dark:text-slate-800 transition text-left cursor-pointer">
                            <input type="radio" name="filter-sort" value="date" checked class="rounded-full border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span>Submission Date</span>
                        </label>
                        <label class="whitespace-nowrap sort-option flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-100 text-slate-200 dark:text-slate-800 transition text-left cursor-pointer">
                            <input type="radio" name="filter-sort" value="updated" class="rounded-full border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span>Last Updated</span>
                        </label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button id="clear-filters-btn" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-700 dark:bg-slate-200 text-slate-200 dark:text-slate-800 hover:bg-slate-600 dark:hover:bg-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">Clear Filters</button>
                    <button id="apply-filters-btn" disabled class="w-full sm:w-auto px-6 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-blue-600 text-white hover:bg-blue-500 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Apply Filters</button>
                </div>

            </div>
        </div>

        <!-- Projects Grid Container (Dynamically Populated from repos.json) -->
        <div id="projects-grid" class="space-y-8">
            <!-- Populated dynamically via main.js -->
        </div>

        <!-- Load More Projects Button Container -->
        <div id="load-more-container" class="text-center pt-6 hidden">
            <button id="load-more-btn" class="px-6 py-3 rounded-xl text-sm font-semibold bg-slate-800 dark:bg-slate-200 text-slate-200 dark:text-slate-800 hover:bg-slate-700 dark:hover:bg-slate-300 transition shadow-sm cursor-pointer">
                Load More Projects
            </button>
        </div>

    </main>

    <!-- Footer gets injected here -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/main.js"></script>

</body>
</html>
