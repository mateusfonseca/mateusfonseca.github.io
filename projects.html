<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Mateus Fonseca Campos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script>
        if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body data-page="projects" class="bg-slate-900 text-slate-100 dark:bg-slate-50 dark:text-slate-900 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">
    
    <!-- Navbar gets injected here -->
    <div id="navbar-placeholder"></div>
    
    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto p-6 py-12 space-y-10 flex-grow">
        
        <!-- Page Title & Export Actions -->
        <section class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="space-y-2">
                <h1 class="text-4xl font-extrabold tracking-tight">Projects & Repositories</h1>
                <p class="text-slate-400 dark:text-slate-600 text-lg">
                    Use the controls below to filter and sort the project list.
                </p>
            </div>
        </section>

        <!-- Sophisticated Multi-Dropdown Check Filters -->
        <div id="filter-container" class="bg-slate-800/60 dark:bg-slate-100 p-6 rounded-2xl border border-slate-700/50 dark:border-slate-200 shadow-sm space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                
                <!-- 1. Degree Dropdown -->
                <details class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm hover:border-blue-500 transition">
                        <span class="flex items-center gap-2">
                            Degree
                            <span class="filter-badge hidden bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 space-y-2 text-sm max-h-60 overflow-y-auto">
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-degree" value="masters" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Master's
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-degree" value="bachelors" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Bachelor's
                        </label>
                    </div>
                </details>

                <!-- 2. Programming Language Dropdown -->
                <details class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm hover:border-blue-500 transition">
                        <span class="flex items-center gap-2">
                            Language
                            <span class="filter-badge hidden bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 space-y-2 text-sm max-h-60 overflow-y-auto">
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-lang" value="python" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Python
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-lang" value="csharp" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> C#
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-lang" value="javascript" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> JavaScript
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-lang" value="typescript" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> TypeScript
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-lang" value="kotlin" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Kotlin
                        </label>
                    </div>
                </details>

                <!-- 3. Framework Dropdown -->
                <details class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm hover:border-blue-500 transition">
                        <span class="flex items-center gap-2">
                            Framework
                            <span class="filter-badge hidden bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 space-y-2 text-sm max-h-60 overflow-y-auto">
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="fastapi" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> FastAPI
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="streamlit" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Streamlit
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="flask" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Flask
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="django" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Django
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="dotnet" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> .NET / ASP.NET
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="react" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> React / React Native
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="ionic" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Ionic
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-framework" value="android" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Android Native
                        </label>
                    </div>
                </details>

                <!-- 4. Area Dropdown -->
                <details class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm hover:border-blue-500 transition">
                        <span class="flex items-center gap-2">
                            Area
                            <span class="filter-badge hidden bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 space-y-2 text-sm max-h-60 overflow-y-auto">
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="cloud-arch" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Cloud Arch
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="soft-dev" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Soft Dev
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="cicd" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> CI/CD
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="devops" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> DevOps
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="crypto" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Cryptography
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="mobile" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Mobile Dev
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-area" value="ai" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> AI & Vision
                        </label>
                    </div>
                </details>

                <!-- 5. Others Dropdown -->
                <details class="relative group filter-dropdown">
                    <summary class="filter-summary flex justify-between items-center px-4 py-2.5 bg-slate-900 dark:bg-white text-slate-200 dark:text-slate-800 rounded-xl border border-slate-700 dark:border-slate-300 cursor-pointer text-sm font-medium select-none shadow-sm hover:border-blue-500 transition">
                        <span class="flex items-center gap-2">
                            Others
                            <span class="filter-badge hidden bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="dropdown-menu absolute left-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-3 space-y-2 text-sm max-h-60 overflow-y-auto">
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="terraform" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Terraform
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="aws" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> AWS
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="nginx" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Nginx
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="uvicorn" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Uvicorn
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="mysql" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> MySQL / SQLite
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="docker" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Docker
                        </label>
                        <label class="whitespace-nowrap flex items-center gap-2 cursor-pointer hover:text-blue-400">
                            <input type="checkbox" name="filter-others" value="firebase" class="rounded border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500"> Firebase
                        </label>
                    </div>
                </details>

                <!-- 6. Sort Dropdown with Two-in-One Ascending/Descending Toggle -->
                <div id="sort-container" class="filter-dropdown relative flex items-center bg-slate-900 dark:bg-white rounded-xl border border-blue-500 text-blue-400 dark:text-blue-600 font-semibold shadow-sm hover:border-blue-500 transition">
                    
                    <!-- Left Part: Sort Dropdown Summary (Clicking this toggles the menu manually via JS) -->
                    <div id="sort-summary-wrapper" class="flex-grow">
                        <div id="sort-trigger" class="flex justify-between items-center px-4 py-2.5 cursor-pointer text-sm select-none">
                            <span id="sort-summary-text">Sort by</span>
                            <svg id="sort-chevron" class="w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>

                    <!-- Right Part: Ascending / Descending Toggler Button -->
                    <button type="button" id="sort-order-btn" title="Toggle Sort Order" class="px-3 py-2.5 border-l border-slate-700 dark:border-slate-300 text-slate-400 hover:text-slate-200 dark:hover:text-slate-800 transition flex items-center justify-center shrink-0">
                        <svg id="sort-icon" class="w-4 h-4 transition-transform duration-200 scale-y-[-1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h8M3 12h6M3 18h4"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 18V6m0 0l-4 4m4-4l4 4"/>
                        </svg>
                    </button>

                    <!-- Dropdown Menu is now a direct child of the entire #sort-container wrapper -->
                    <div id="sort-dropdown-menu" class="dropdown-menu absolute top-full right-0 z-20 mt-2 min-w-full w-max bg-slate-900 dark:bg-white border border-slate-700 dark:border-slate-300 rounded-xl shadow-xl p-2 space-y-1 text-sm font-normal hidden">
                        <label class="whitespace-nowrap sort-option flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-100 text-slate-200 dark:text-slate-800 transition text-left cursor-pointer">
                            <input type="radio" name="filter-sort" value="date" checked class="rounded-full border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span>Submission Date</span>
                        </label>
                        <label class="whitespace-nowrap sort-option flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-100 text-slate-200 dark:text-slate-800 transition text-left cursor-pointer">
                            <input type="radio" name="filter-sort" value="updated" class="rounded-full border-slate-700 dark:border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <span>Last Updated</span>
                        </label>
                    </div>
                </div>           

            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-3 pt-6 border-t border-slate-700/50 dark:border-slate-200">
                <button id="clear-filters-btn" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-700 dark:bg-slate-200 text-slate-200 dark:text-slate-800 hover:bg-slate-600 dark:hover:bg-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">Clear Filters</button>
                <button id="apply-filters-btn" disabled class="px-6 py-2.5 rounded-xl text-sm font-semibold bg-blue-600 text-white hover:bg-blue-500 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Apply Filters</button>
            </div>
        </div>

        <!-- Projects Grid Container (Dynamically Populated from repos.json) -->
        <div id="projects-grid" class="space-y-8">
            <!-- Populated dynamically via main.js -->
        </div>

        <!-- Load More Projects Button Container -->
        <div id="load-more-container" class="text-center pt-6 hidden">
            <button id="load-more-btn" class="px-6 py-3 rounded-xl text-sm font-semibold bg-slate-800 dark:bg-slate-200 text-slate-200 dark:text-slate-800 hover:bg-slate-700 dark:hover:bg-slate-300 transition shadow-sm cursor-pointer">
                Load More Projects
            </button>
        </div>

    </main>

    <!-- Footer gets injected here -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/main.js"></script>

</body>
</html>
