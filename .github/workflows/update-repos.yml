name: Update Repository Metadata

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC automatically
  workflow_dispatch:    # Allows you to trigger it manually anytime from the Actions tab
  push:
    branches:
      - main            # Triggers if you push changes directly to your portfolio repository
    paths:
      - 'assets/data/projects-meta.json' # Specifically watches your custom summary metadata file

permissions:
  contents: write       # Grants permission to commit updated repos.json back to your repo

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run repository fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repos.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/repos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update repository metadata [skip ci]" && git push)