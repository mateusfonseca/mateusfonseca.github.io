name: Update Repository Metadata

"on":
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC automatically
  workflow_dispatch:    # Allows you to trigger it manually anytime from the Actions tab
  push:
    branches:
      - main
    paths:
      - 'assets/scripts/fetch_repos.py'

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python assets/scripts/fetch_repos.py

      - name: Commit updated repository metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/repos.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update repository metadata"
            git push
          fi