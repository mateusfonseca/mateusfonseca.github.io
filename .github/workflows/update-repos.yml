name: Update Repository Metadata

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC automatically
  workflow_dispatch:    # Allows you to trigger it manually anytime from the Actions tab
  push:
    branches:
      - main
    paths:
      - 'assets/scripts/fetch_repos.py'

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch_repos.py
        run: python assets/scripts/fetch_repos.py